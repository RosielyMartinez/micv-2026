<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Rosiely Martínez Bandala</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1f2933;
        }
        .tarjeta {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px 30px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #102a43;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f0f4f8;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu a {
            display: block;
            text-decoration: none;
            background-color: #f8fafc;
            color: #243b53;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 0.98rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .menu a:hover {
            background-color: #1d4ed8;
            color: #ffffff;
            border-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2);
        }
    </style>
</head>
<body>

<div class="tarjeta">
    <h1>RosielyMartinez cv</h1>
    <nav class="menu">
        <a href="#encabezado">encabezado</a>
        <a href="#experiencia">experiencia laboral</a>
        <a href="#educacion">educación</a>
        <a href="#habilidades">habilidades</a>
        <a href="#certificados">certificados</a>
        <a href="#idiomas">idiomas</a>
        <a href="#interes">interés</a>
    </nav>
</div>

</body>
</html>
